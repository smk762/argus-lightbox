name: Deploy demo

# Builds the hosted demo (lightbox.dragonhound.dev) from the committed tape bake
# in web/public/data-tape and uploads web/out to Cloudflare Pages. Needs the repo
# secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID, and the
# Pages project created once: `npx wrangler pages project create argus-lightbox --production-branch main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test  # don't publish a build the contract tests reject
        working-directory: web
      - run: make pages
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=argus-lightbox --branch=main
